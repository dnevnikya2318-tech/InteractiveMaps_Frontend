<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drag And Drop</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <div id="root">
        <div class="flex flex-col">
            <header>
                <div id="header-left">
                    <div id="main-emblem">✦</div>
                    <div>
                        <div id="site-title">Interactive Maps</div>
                        <div id="site-subtitle">Realm Atlas</div>
                    </div>
                    
                </div>
                <div id="map-title">Map Title</div>
                <div id="sign-in-up">Sign in/Sign up</div>
            </header>
            <div id="main">
                <div id="main-title">
                    <div id="stars-top">✦ ✦ ✦</div>
                    <h1>Interactive Maps</h1>
                    <p>Realm Atlas &amp; Point of Interest Marker</p>
                    <div id="stars-bottom">✦ ✦ ✦</div>
                </div>
                <!-- Зона загрузки -->
                <div id="drop-area" class="drop-zone">
                    <div class="input-corner" style="inset: 12px auto auto 12px; border-style: solid none none solid;"></div>
                    <div class="input-corner" style="inset: 12px 12px auto auto; border-style: solid solid none none;"></div>
                    <div class="input-corner" style="inset: auto auto 12px 12px; border-style: none none solid solid;"></div>
                    <div class="input-corner" style="inset: auto 12px 12px auto; border-style: none solid solid none;"></div>
                    <span class="drop-zone__prompt">Перетащите карту или нажмите сюда</span>
                    <input type="file" id="file-input" class="drop-zone__input" accept="image/*">
                </div>

                <!-- Контейнер для просмотра (появляется вместо drop_zone) -->
                <div id="view-area">
                    <div class="controls">
                        <button id="reset-btn" type="button">Отмена</button>
                    </div>

                    <div id="image-wrapper">
                        <img id="full-preview" src="" alt="Просмотр">
                        <div id="markers-layer"></div>
                        <div id="label-popup" class="popup">
                            <button id="add-label-btn" type="button">Добавить метку</button>
                        </div>
                        <div id="delete-popup" class="d-popup">
                            <button id="delete-label-btn" type="button">Удалить метку</button>
                        </div>
                    </div>
        
        
                </div>
            </div>

            <script src="scripts/index.js"></script>
        </div>
    </div>
</body>
</html>
