<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/login.css">

    <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">

    <title>Login & Register Page</title>
</head>

<body>
    <div class="container" id="container">
        <div class="form-container sign-up">
            <form id="registerForm">
                <h1>Create Account</h1>
                <span>Register with E-mail</span>
                <input type="text" id="usernameRegister" placeholder="Username" required>
                <input type="email" id="emailRegister" placeholder="Enter E-mail" required>
                <input type="password" id="passwordRegister" placeholder="Enter Password" required>
                <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
                <button type="submit">Sign Up</button>
                <p id="messageRegister"></p>
            </form>
            
        </div>

        <div class="form-container sign-in">
            <form id="loginForm">
                <h1>Sign In</h1>
                <span>Login With E-mail & Password</span>
                <input type="email" id="emailLogin" placeholder="Enter E-mail" required>
                <input type="password" id="passwordLogin" placeholder="Enter Password" required>
                <a href="#">Forget Password?</a>
                <button type="submit">Sign In</button>
                <p id="messageLogin"></p>
            </form>
            
        </div>

        <div class="toggle-container">
            <div class="toggle">
                <div class="toggle-panel toggle-left">
                    <h1>Welcome To <br>Intermapcer</h1>
                    <p>Sign in With E-mail & Password</p>
                    <button class="hidden" id="login">Sign In</button>
                </div>
                <div class="toggle-panel toggle-right">
                    <h1>Intermapcer</h1>
                    <p>Join to Fill Your Worlds With Content</p>
                    <button class="hidden" id="register">Sign Up</button>
                </div>
            </div>
        </div>


    </div>


    <script src="scripts/login.js"></script>
</body>
</html>
